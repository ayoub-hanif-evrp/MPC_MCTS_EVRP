study: screening
fleet_mode: fixed_reference
prediction_horizon: 5
control_horizon: 1
mcts_iterations: 32
top_L: 3
candidate_limit: 12
station_candidate_limit: 4
charge_target_limit: 5
charging_mode: partial
route_continuity: true
regret_repair: true
proposal_selection: quality
dynamic_selection_mode: exact_count
parallel_agents: false
workers: 1
trace_level: summary
max_idle_wait: 0
require_root_coverage: true
experiment_seed: 0
scenario_seed: 0
dynamicity: 0.5
algorithm: COORDINATED_MPC_MCTS
reference_solver_multistarts: 3
reference_improvement_passes: 1
reference_seed: 0
reference_label_limit: 24
budget_mode: iterations
instances: [c101_21, c201_21, r101_21, r201_21, rc101_21, rc201_21]
# Stage 1: 6 instances x DoD [0,.5] x 3 algorithms, both seeds 0.
# Stage 2: 6 instances x DoD [.25,.5,.75] x scenario seeds [0,1] x 3 algorithms.
# Stage 1 coordinated gate: all 6 static complete, dynamic mean >=.98 and >=5 complete.
# Stage 2 excludes unrealized DoD; all exclusions remain in the manifest.
gate:
  bootstrap_samples: 2000
  bootstrap_seed: 0
  min_improving_pairs: 2
  min_improving_families: 2
  max_p95_planning_seconds: 5.0
