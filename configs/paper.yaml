# Planning is the default. Execution requires --execute and a passing calibration gate.
study: paper
mcts_iterations: 16
prediction_horizon: 5
top_L: 3
candidate_limit: 12
station_candidate_limit: 4
charge_target_limit: 5
charging_mode: partial
trace_level: summary
symmetry_reuse: false
parallel_agents: false
workers: 4
confirmation_hours: 6
maximum_paper_hours: 6
performance_gate_seconds: 60
calibration_report: results/performance/calibration.json
result_compression: gzip

